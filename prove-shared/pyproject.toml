[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prove_shared"
version = "0.1.0"
description = "Shared utilities for ProVe services"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.6",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "requests>=2.31",
    "boto3>=1.34",
    "numpy>=1.24",
    "qwikidata>=0.4.2",
    "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["prove_shared*"]
