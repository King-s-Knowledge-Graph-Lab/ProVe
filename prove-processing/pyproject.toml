[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prove-processing"
version = "1.0.0"
description = "ProVe Inference Service — NLP pipeline for claim verification"
requires-python = ">=3.10"

dependencies = [
    "prove-shared",
    "torch",
    "transformers==4.46.3",
    "pytorch_lightning==2.4.0",
    "qwikidata",
    "nltk",
    "bs4",
    "selenium",
    "html2text",
    "rouge_score",
    "sacrebleu",
    "sparqlwrapper",
    "schedule",
]

[tool.setuptools]
packages = []

[tool.uv.sources]
prove-shared = { path = "../prove-shared" }
